<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Proyector - Peidagogos STEAM</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0B0F19; color: #F3F4F6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-y: auto;
        }
        .screen {
            display: none; width: 100%; min-height: 100%; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px; box-sizing: border-box;
            text-align: center; position: relative;
        }
        .active-screen { display: flex; }
        
        /* Typography */
        h1 { font-size: 4rem; font-weight: 900; margin-bottom: 20px; color: #60A5FA; text-shadow: 0 0 20px rgba(96,165,250,0.3); }
        h2 { font-size: 2.5rem; font-weight: 700; margin-bottom: 30px; color: #E5E7EB; }
        p { font-size: 1.5rem; line-height: 1.6; max-width: 900px; margin-bottom: 30px; color: #9CA3AF; }
        
        /* Controls */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .btn-class {
            background: rgba(31, 41, 55, 0.8); border: 2px solid #374151; padding: 30px; border-radius: 16px;
            font-size: 1.5rem; font-weight: bold; color: white; cursor: pointer; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .btn-class:hover { transform: translateY(-5px); border-color: #60A5FA; background: rgba(59, 130, 246, 0.2); box-shadow: 0 10px 30px rgba(59,130,246,0.2); }
        .btn-class i { font-size: 3rem; color: #60A5FA; }

        .btn-nav {
            background: #3B82F6; color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(59,130,246,0.4);
        }
        .btn-nav:hover { background: #2563EB; transform: scale(1.05); }
        .btn-nav-outline { background: transparent; border: 2px solid #4B5563; }
        
        .controls-bottom { margin-top: 40px; display: flex; gap: 20px; }
        .btn-close { position: absolute; top: 30px; right: 30px; background: rgba(239,68,68,0.2); border: 1px solid #EF4444; color: #EF4444; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; transition: 0.2s;}
        .btn-close:hover { background: #EF4444; color: white; }

        /* Timer */
        .timer-display { font-size: 8rem; font-weight: 900; font-variant-numeric: tabular-nums; color: #FBBF24; text-shadow: 0 0 40px rgba(251,191,36,0.4); margin: 20px 0; }
        .timer-pulse { animation: pulse 1s infinite; color: #EF4444; text-shadow: 0 0 40px rgba(239,68,68,0.6); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Artística Rhythm Game */
        .rhythm-container { display: flex; gap: 30px; margin: 50px 0; }
        .rhythm-pad { width: 150px; height: 150px; border-radius: 50%; background: #374151; border: 4px solid #4B5563; display: flex; justify-content: center; align-items: center; font-size: 3rem; transition: 0.1s; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .pad-active-red { background: #EF4444; border-color: #FCA5A5; box-shadow: 0 0 50px #EF4444; transform: scale(1.1); color: white; }
        .pad-active-blue { background: #3B82F6; border-color: #93C5FD; box-shadow: 0 0 50px #3B82F6; transform: scale(1.1); color: white; }
        .pad-active-yellow { background: #FBBF24; border-color: #FDE68A; box-shadow: 0 0 50px #FBBF24; transform: scale(1.1); color: white; }

        .notebook-icon { font-size: 6rem; color: #10B981; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="screen-menu" class="screen active-screen">
        <a href="login.html" class="btn-close" title="Volver al Panel"><i class="ph ph-x"></i></a>
        <h1>Modo Proyector</h1>
        <p>Selecciona la clase magistral para proyectar. Los estudiantes solo necesitarán su cuaderno y un lápiz.</p>
        
        <div class="menu-grid">
            <button class="btn-class" onclick="startClass('fisica6')">
                <i class="ph ph-planet"></i> Física 6º<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Movimiento y Reposo</span>
            </button>
            <button class="btn-class" onclick="startClass('fisica7')">
                <i class="ph ph-trend-up"></i> Física 7º<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Vectores y Fuerzas</span>
            </button>
            <button class="btn-class" onclick="startClass('quimica')">
                <i class="ph ph-flask"></i> Química PENSAR<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Mezclas y Separación</span>
            </button>
            <button class="btn-class" onclick="startClass('etica')">
                <i class="ph ph-scales"></i> Ética<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Dilemas Morales</span>
            </button>
            <button class="btn-class" onclick="startClass('artistica')">
                <i class="ph ph-music-notes"></i> Artística<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Percusión Interactiva</span>
            </button>
        </div>
    </div>

    <!-- PANTALLA GENÉRICA DE CLASE -->
    <div id="screen-slide" class="screen">
        <button class="btn-close" onclick="backToMenu()"><i class="ph ph-house"></i></button>
        
        <div id="slide-icon" class="notebook-icon"><i class="ph ph-notebook"></i></div>
        <h1 id="slide-title">Título</h1>
        <h2 id="slide-subtitle">Subtítulo</h2>
        <p id="slide-content">Contenido</p>
        
        <div id="slide-custom-area"></div>

        <div id="timer-container" style="display:none; flex-direction: column; align-items: center;">
            <div id="timer-text" class="timer-display">00:00</div>
            <button class="btn-nav btn-nav-outline" onclick="startTimerGlobal()" id="btn-start-timer"><i class="ph ph-play"></i> Iniciar Tiempo</button>
        </div>

        <div class="controls-bottom">
            <button class="btn-nav btn-nav-outline" onclick="prevSlide()"><i class="ph ph-arrow-left"></i> Anterior</button>
            <button class="btn-nav" onclick="nextSlide()">Siguiente <i class="ph ph-arrow-right"></i></button>
        </div>
    </div>

    <script>
        // DATOS DE LAS CLASES (1 HORA APROX)
        const classData = {
            fisica6: [
                { title: "Misión: El Universo Estático", sub: "1/10 - Preparación", content: "Hoy seremos observadores espaciales.<br>Tienen 2 minutos para alistar únicamente su cuaderno (bitácora), lápiz y regla. Guarden lo demás.", icon: "ph-planet", timer: 120 },
                { title: "Reto Visual: Tren Bala", sub: "2/10 - Dibuja el escenario", content: "Imagina que estás dentro de un tren bala a 300 km/h. Tienes una manzana en tu mano. Afuera hay un árbol.<br>Dibuja la escena en 5 minutos.", icon: "ph-pencil-line", timer: 300 },
                { title: "Análisis del Sistema", sub: "3/10 - Argumentación", content: "Observando tu dibujo: ¿La manzana está en movimiento o en reposo? Justifica tu respuesta en un párrafo corto pensando en el ÁRBOL vs TÚ.", icon: "ph-text-align-left", timer: 300 },
                { title: "Cuadro Clasificatorio", sub: "4/10 - Movimiento Absoluto vs Relativo", content: "Dibuja una tabla de 2 columnas: 'En Reposo' y 'En Movimiento'.<br>Clasifica: El Sol, Tu pupitre, La Luna, Una nube, El tablero del salón.", icon: "ph-table", timer: 300 },
                { title: "El Misterio del Semáforo", sub: "5/10 - Escenario Mental", content: "Estás en un carro detenido en un semáforo. El carro de al lado avanza y tú sientes que te vas hacia atrás.<br>Escribe por qué tu cerebro se confunde con el punto de referencia.", icon: "ph-brain", timer: 300 },
                { title: "Trayectorias: Dibuja", sub: "6/10 - Tipos de Movimiento", content: "Divide tu hoja en tres cuadros. Dibuja un ejemplo real para cada tipo de trayectoria:<br>1. Rectilínea (Línea recta)<br>2. Circular<br>3. Parabólica (Como lanzar un balón)", icon: "ph-scribble-loop", timer: 300 },
                { title: "Desafío de Rapidez", sub: "7/10 - Matemáticas simples", content: "Si un guepardo corre 100 metros en 10 segundos...<br>¿Cuántos metros corre en 1 solo segundo?<br>Muestra el cálculo matemático simple (División) en tu cuaderno.", icon: "ph-calculator", timer: 300 },
                { title: "Mapa Conceptual", sub: "8/10 - Síntesis", content: "Dibuja un mapa conceptual que conecte las siguientes 4 palabras clave:<br>PUNTO DE REFERENCIA, MOVIMIENTO, REPOSO, OBSERVADOR.", icon: "ph-tree-structure", timer: 300 },
                { title: "Verdadero o Falso", sub: "9/10 - Justifica el error", content: "Copia la frase y escribe V o F. Si es F, corrígela:<br>'Si estoy sentado en un avión volando, estoy en reposo absoluto para todo el universo.'", icon: "ph-check-square-offset", timer: 300 },
                { title: "Simulacro ICFES", sub: "10/10 - Lectura Crítica", content: "Para un astronauta en la Estación Espacial, la Tierra gira bajo sus pies. Para nosotros, la Estación cruza el cielo. Esto demuestra que:<br>A) La Tierra está en reposo absoluto<br>B) El movimiento depende del observador<br>C) La Estación está quieta.", icon: "ph-exam", timer: 300 }
            ],
            fisica7: [
                { title: "Operación Fuerzas", sub: "1/10 - Preparación", content: "Entraremos al mundo invisible de los Vectores.<br>Tienen 2 minutos para alistar su cuaderno, lápiz y ojalá una regla.", icon: "ph-trend-up", timer: 120 },
                { title: "Gráfica Cardinal", sub: "2/10 - Rosa de los Vientos", content: "Dibuja grande en tu cuaderno la Rosa de los Vientos (Norte arriba, Sur abajo, Este derecha, Oeste izquierda).", icon: "ph-compass", timer: 300 },
                { title: "Vector Resultante 1D", sub: "3/10 - Suma simple", content: "Dibuja una caja. Una persona la empuja al ESTE con 10 Newtons. Otra persona también al ESTE con 5 Newtons.<br>Dibuja una flecha grande que represente la fuerza final (15N).", icon: "ph-arrow-right", timer: 300 },
                { title: "El Tira y Afloje", sub: "4/10 - Resta de Fuerzas", content: "Juego de soga. Equipo A tira a la Izquierda con 50N. Equipo B tira a la Derecha con 40N.<br>Dibuja el diagrama y escribe con cuánta fuerza gana el Equipo A.", icon: "ph-arrows-left-right", timer: 300 },
                { title: "El Plano Cartesiano", sub: "5/10 - 2 Dimensiones", content: "Dibuja un eje X y un eje Y. Marca desde el cero hasta el número 5 en todos los lados.<br>Ubica un punto en la coordenada (3, 4) y traza una flecha desde el (0,0) hasta ese punto.", icon: "ph-chart-line-up", timer: 300 },
                { title: "El Enigma del Avión", sub: "6/10 - Analiza el dibujo", content: "Dibuja un avión que intenta volar hacia el NORTE, pero un viento muy fuerte lo empuja hacia el ESTE.<br>Dibuja con una flecha roja hacia dónde terminará moviéndose realmente el avión (Diagonal).", icon: "ph-airplane-tilt", timer: 300 },
                { title: "Reto Pitágoras", sub: "7/10 - Geometría", content: "En tu dibujo anterior se formó un triángulo rectángulo.<br>Si el avión vuela a 400 km/h y el viento a 300 km/h... anota la fórmula de Pitágoras (a² + b² = c²) para hallar la velocidad real.", icon: "ph-function", timer: 300 },
                { title: "Cuadro de Propiedades", sub: "8/10 - Magnitud y Dirección", content: "Haz una tabla. Explica con tus propias palabras qué significa:<br>- Magnitud de un vector (Pista: tamaño/fuerza)<br>- Dirección de un vector (Pista: el ángulo/Norte)", icon: "ph-table", timer: 300 },
                { title: "Diseña tu problema", sub: "9/10 - Creación", content: "Inventa e ilustra un problema donde 3 fuerzas actúen sobre un mismo objeto (ej: un burro empujando una carreta y dos humanos tirando de ella).", icon: "ph-pencil-line", timer: 300 },
                { title: "Evaluación ICFES", sub: "10/10 - Análisis", content: "Si dos fuerzas de 10N empujan un objeto en sentidos opuestos (Norte y Sur). ¿Qué le pasa al objeto?<br>A) Se mueve al Norte<br>B) Se mueve al Sur<br>C) Se queda en reposo (Fuerza Neta = 0).", icon: "ph-exam", timer: 300 }
            ],
            quimica: [
                { title: "Laboratorio PENSAR", sub: "1/10 - Preparación", content: "Hoy seremos alquimistas modernos.<br>Alista tu cuaderno de laboratorio y lápiz. Tiempo: 2 minutos.", icon: "ph-flask", timer: 120 },
                { title: "Diagnóstico Inicial", sub: "2/10 - Cuadro de 2 columnas", content: "Dibuja una tabla: HOMOGÉNEA y HETEROGÉNEA.<br>Ubica: Sangre, Agua con Sal, Ensalada de frutas, Aire, Agua con Aceite.", icon: "ph-table", timer: 300 },
                { title: "Modelo Corpuscular", sub: "3/10 - Dibuja Átomos", content: "Dibuja cómo se ven por dentro (con lupas gigantes imaginarias):<br>1. Agua con sal mezclada uniformemente.<br>2. Agua y aceite separados por capas.", icon: "ph-atom", timer: 300 },
                { title: "Concepto de Soluto", sub: "4/10 - Análisis Teórico", content: "En el agua con sal, ¿quién es el SOLVENTE (el que disuelve) y quién es el SOLUTO (el que es disuelto)?<br>Explica la diferencia en dos renglones.", icon: "ph-drop", timer: 300 },
                { title: "Filtración: Esquema", sub: "5/10 - Dibuja el método", content: "Dibuja un vaso, un embudo con papel filtro y arena. Explica cómo la filtración separa sólidos que NO se disuelven en el líquido.", icon: "ph-funnel", timer: 300 },
                { title: "Evaporación: Esquema", sub: "6/10 - Método de Separación", content: "Dibuja una olla en el fuego evaporando agua para dejar solo la sal en el fondo.<br>Explica por qué sirve para sólidos que SÍ se disolvieron.", icon: "ph-fire", timer: 300 },
                { title: "Magnetismo", sub: "7/10 - Dibuja el método", content: "Dibuja un imán separando virutas de hierro de un montículo de arena.<br>Explica qué propiedad física permite esto.", icon: "ph-magnet", timer: 300 },
                { title: "Reto de Ingeniería", sub: "8/10 - Planta Purificadora", content: "Dibuja una 'máquina' secuencial de 3 pasos para limpiar agua turbia (contiene lodo grueso, arena fina y sal) para hacerla potable.", icon: "ph-gear", timer: 300 },
                { title: "Diferencia Crucial", sub: "9/10 - Síntesis", content: "En 5 líneas: ¿Cuál es la diferencia química entre mezclar (agua y sal) y reaccionar (quemar un papel)?<br>Pista: En una mezcla, los componentes se pueden separar de nuevo.", icon: "ph-file-text", timer: 300 },
                { title: "Simulacro ICFES", sub: "10/10 - Caso Práctico", content: "Para separar una mezcla de agua y alcohol (que son líquidos que se mezclan perfectamente y tienen distinto punto de ebullición), el mejor método es:<br>A) Filtración<br>B) Destilación<br>C) Imantación", icon: "ph-exam", timer: 300 }
            ],
            etica: [
                { title: "Foro de Valores", sub: "1/10 - Preparación", content: "Cierren los ojos. Prepárense para escuchar y escribir. Alisten su cuaderno de reflexiones.", icon: "ph-scales", timer: 120 },
                { title: "Dilema 1: El Billete", sub: "2/10 - El Escenario", content: "Ves que a tu mejor amigo se le caen $50.000, los cuales iba a usar en un videojuego. Pero tu familia no tiene para almorzar hoy.<br>Describe el dilema ético con tus propias palabras.", icon: "ph-money", timer: 300 },
                { title: "Argumento A favor", sub: "3/10 - Quedarse el dinero", content: "Incluso si no estás de acuerdo, escribe 3 razones LÓGICAS de por qué alguien justificaría quedarse el dinero (ej: necesidad vital vs ocio).", icon: "ph-hand-coins", timer: 300 },
                { title: "Argumento En contra", sub: "4/10 - Devolver el dinero", content: "Escribe 3 razones ÉTICAS de por qué es obligatorio devolver el dinero sin importar la situación familiar (ej: respeto a la propiedad, amistad).", icon: "ph-hand-heart", timer: 300 },
                { title: "Tu Sentencia", sub: "5/10 - Toma de decisión", content: "Ahora sí, escribe qué harías TÚ exactamente y por qué. Tienes 5 minutos para redactar un párrafo poderoso y convicente.", icon: "ph-gavel", timer: 300 },
                { title: "Dilema 2: El Grupo", sub: "6/10 - Presión Social", content: "En WhatsApp, todos se burlan cruelmente de un chico nuevo. Si lo defiendes, te expulsarán y te harán bullying a ti.<br>Escribe cómo te sentirías en ese instante.", icon: "ph-chat-circle-text", timer: 300 },
                { title: "El Observador", sub: "7/10 - El cómplice silencioso", content: "Dibuja un 'Espectador Pasivo' (alguien que lee el chat y no dice nada).<br>Explica por qué guardar silencio es también una forma de participar en el daño.", icon: "ph-eye-closed", timer: 300 },
                { title: "Gráfica de Emociones", sub: "8/10 - Análisis del Bullying", content: "Dibuja un termómetro. Abajo escribe el sentimiento de la víctima. En el medio el del espectador. Arriba el del acosador. Reflexiona sobre esos estados.", icon: "ph-thermometer", timer: 300 },
                { title: "Decálogo de Paz", sub: "9/10 - Síntesis", content: "Redacta 3 'Reglas de Oro' que deberían existir en cualquier chat grupal de este colegio para evitar el ciberacoso.", icon: "ph-scroll", timer: 300 },
                { title: "Empatía", sub: "10/10 - Conclusión Personal", content: "Construye tu propia definición de la palabra EMPATÍA en base a los dos dilemas (el amigo y el chat). ¿Es la empatía algo pasivo o activo?", icon: "ph-heart", timer: 300 }
            ],
            artistica: [
                { title: "Ensamble Percusivo", sub: "1/10 - Preparación", content: "Hoy tus manos, tu cerebro y tu atención serán el único instrumento. Despeja tu escritorio, solo necesitas tu cuaderno para empezar.", icon: "ph-music-notes", timer: 120 },
                { title: "Simbología Visual", sub: "2/10 - Copia la leyenda", content: "Copia esto grande y en colores:<br>🔴 ROJO = Aplauso (¡PLAS!)<br>🔵 AZUL = Golpe en la mesa (¡PAM!)<br>🟡 AMARILLO = Silencio (Manos arriba)", icon: "ph-palette", timer: 300 },
                { title: "Escritura Rítmica", sub: "3/10 - Patrón 4/4", content: "Dibuja una cuadrícula de 4 espacios (como casillas). Pinta la 1 de rojo, la 2 azul, la 3 amarillo y la 4 rojo. Repasa mentalmente cómo suena eso.", icon: "ph-pencil-line", timer: 300 },
                { title: "Práctica de Nivel 1", sub: "4/10 - Sincronización Básica", content: "Sigue los pulsos de la pantalla. Concentración total, nadie debe acelerarse.", icon: "ph-metronome", customHtml: `<div class="rhythm-container"><div id="pad-1" class="rhythm-pad"><i class="ph ph-hand-clapping"></i></div><div id="pad-2" class="rhythm-pad"><i class="ph ph-hand-pointing"></i></div></div><button class="btn-nav" onclick="startRhythm(1)">▶ Iniciar Secuencia</button>`, timer: 300 },
                { title: "Composición Libre", sub: "5/10 - Crea tu partitura", content: "Dibuja ahora una cuadrícula de 8 espacios (8 tiempos). Rellénala con los colores que quieras, pero DEBE tener exactamente 2 silencios (amarillos).", icon: "ph-scribble-loop", timer: 300 },
                { title: "Análisis del Silencio", sub: "6/10 - Reflexión en cuaderno", content: "Escribe: ¿Por qué en la música es tan importante el silencio (color amarillo) como el golpe (rojo/azul)? ¿Qué pasaría sin silencios?", icon: "ph-ear", timer: 300 },
                { title: "Ensayo Grupal", sub: "7/10 - Trabajo de a 4", content: "Júntate con 3 compañeros. Muestren sus partituras (los dibujos de 8 colores) y elijan la más difícil. Ensáyenla juntos en bucle.", icon: "ph-users", timer: 300 },
                { title: "Polirritmia Mental", sub: "8/10 - Dibuja el reto", content: "La polirritmia es hacer dos ritmos a la vez. Dibuja un cerebro dividido en dos mitades.<br>Escribe: 'Mano izquierda golpea cada 2 segundos. Mano derecha cada 3 segundos.'", icon: "ph-brain", timer: 300 },
                { title: "Nivel 2 (Polirritmia)", sub: "9/10 - Doble Velocidad", content: "Intenta seguir esta secuencia asimétrica en la pantalla. ¡No te rindas si te equivocas, retoma el ritmo!", icon: "ph-lightning", customHtml: `<div class="rhythm-container"><div id="pad-3" class="rhythm-pad"><i class="ph ph-hand-clapping"></i></div><div id="pad-4" class="rhythm-pad"><i class="ph ph-hand-pointing"></i></div><div id="pad-5" class="rhythm-pad"><i class="ph ph-hands-clapping"></i></div></div><button class="btn-nav" onclick="startRhythm(2)">▶ Iniciar Nivel 2</button>`, timer: 300 },
                { title: "Cierre de Ensayo", sub: "10/10 - Evaluación Personal", content: "Escribe en tu cuaderno del 1 al 10 qué tan difícil fue mantener la sincronización y por qué la percusión exige trabajo en equipo.", icon: "ph-check-circle", timer: 300 }
            ]
        };

        let currentCourse = null;
        let currentSlideIdx = 0;
        let timerInterval = null;
        let currentTimerSeconds = 0;

        function startClass(courseId) {
            currentCourse = classData[courseId];
            currentSlideIdx = 0;
            document.getElementById('screen-menu').classList.remove('active-screen');
            document.getElementById('screen-slide').classList.add('active-screen');
            renderSlide();
        }

        function backToMenu() {
            clearInterval(timerInterval);
            document.getElementById('screen-slide').classList.remove('active-screen');
            document.getElementById('screen-menu').classList.add('active-screen');
        }

        function nextSlide() {
            if (currentSlideIdx < currentCourse.length - 1) {
                currentSlideIdx++;
                renderSlide();
            } else {
                alert("Fin de la clase magistral.");
                backToMenu();
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                currentSlideIdx--;
                renderSlide();
            }
        }

        function renderSlide() {
            clearInterval(timerInterval);
            const slide = currentCourse[currentSlideIdx];
            
            document.getElementById('slide-title').innerHTML = slide.title;
            document.getElementById('slide-subtitle').innerHTML = slide.sub;
            document.getElementById('slide-content').innerHTML = slide.content;
            document.getElementById('slide-icon').innerHTML = `<i class="ph ${slide.icon}"></i>`;
            
            const customArea = document.getElementById('slide-custom-area');
            customArea.innerHTML = slide.customHtml || "";

            const timerContainer = document.getElementById('timer-container');
            const timerText = document.getElementById('timer-text');
            const btnTimer = document.getElementById('btn-start-timer');

            if (slide.timer) {
                timerContainer.style.display = 'flex';
                currentTimerSeconds = slide.timer;
                updateTimerDisplay();
                btnTimer.style.display = 'block';
                timerText.classList.remove('timer-pulse');
                timerText.style.color = '#FBBF24';
            } else {
                timerContainer.style.display = 'none';
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(currentTimerSeconds / 60).toString().padStart(2, '0');
            const s = (currentTimerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${m}:${s}`;
        }

        function startTimerGlobal() {
            document.getElementById('btn-start-timer').style.display = 'none';
            timerInterval = setInterval(() => {
                if (currentTimerSeconds > 0) {
                    currentTimerSeconds--;
                    updateTimerDisplay();
                    if (currentTimerSeconds <= 10) {
                        document.getElementById('timer-text').classList.add('timer-pulse');
                    }
                } else {
                    clearInterval(timerInterval);
                    document.getElementById('timer-text').style.color = '#EF4444';
                    document.getElementById('timer-text').innerText = "¡TIEMPO!";
                    document.getElementById('timer-text').classList.remove('timer-pulse');
                    // Play a soft beep if needed
                }
            }, 1000);
        }

        // =====================================
        // MOTOR DE RITMO PARA ARTÍSTICA
        // =====================================
        let rhythmInterval = null;
        function startRhythm(level) {
            if(rhythmInterval) clearInterval(rhythmInterval);
            
            if(level === 1) {
                const p1 = document.getElementById('pad-1');
                const p2 = document.getElementById('pad-2');
                let step = 0;
                // 4/4 Beat: Rojo (aplauso), Silencio, Azul (Mesa), Silencio
                rhythmInterval = setInterval(() => {
                    p1.className = 'rhythm-pad'; p2.className = 'rhythm-pad';
                    p1.innerHTML = `<i class="ph ph-hand-clapping"></i>`;
                    p2.innerHTML = `<i class="ph ph-hand-pointing"></i>`;

                    if (step === 0 || step === 4) {
                        p1.classList.add('pad-active-red');
                        p1.innerHTML = `<strong>¡PLAS!</strong>`;
                    } else if (step === 2 || step === 6) {
                        p2.classList.add('pad-active-blue');
                        p2.innerHTML = `<strong>¡PAM!</strong>`;
                    }
                    
                    step++;
                    if(step > 7) step = 0;
                }, 800); // 800ms = 75 BPM
            }
            
            if(level === 2) {
                const p3 = document.getElementById('pad-3');
                const p4 = document.getElementById('pad-4');
                const p5 = document.getElementById('pad-5');
                let step = 0;
                rhythmInterval = setInterval(() => {
                    p3.className = 'rhythm-pad'; p4.className = 'rhythm-pad'; p5.className = 'rhythm-pad';
                    p3.innerHTML = `<i class="ph ph-hand-clapping"></i>`;
                    p4.innerHTML = `<i class="ph ph-hand-pointing"></i>`;
                    p5.innerHTML = `<i class="ph ph-hands-clapping"></i>`;

                    if (step === 0 || step === 3) p3.classList.add('pad-active-red');
                    if (step === 1 || step === 4) p4.classList.add('pad-active-blue');
                    if (step === 2) p5.classList.add('pad-active-yellow');
                    
                    step++;
                    if(step > 4) step = 0;
                }, 500); // Fast!
            }
        }
    </script>
</body>
