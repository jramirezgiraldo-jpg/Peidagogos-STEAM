<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Proyector - Peidagogos STEAM</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #F8FAFC; color: #1E293B;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-y: auto;
        }
        .screen {
            display: none; width: 100%; min-height: 100%; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px; box-sizing: border-box;
            text-align: center; position: relative;
        }
        .active-screen { display: flex; }
        
        /* Typography */
        h1 { font-size: 4rem; font-weight: 900; margin-bottom: 20px; color: #1E3A8A; text-shadow: 0 4px 10px rgba(30,58,138,0.1); }
        h2 { font-size: 2.5rem; font-weight: 700; margin-bottom: 30px; color: #334155; }
        p { font-size: 1.5rem; line-height: 1.6; max-width: 900px; margin-bottom: 30px; color: #475569; }
        
        /* Controls */
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .btn-class {
            background: #FFFFFF; border: 2px solid #E2E8F0; padding: 30px; border-radius: 16px;
            font-size: 1.5rem; font-weight: bold; color: #1E293B; cursor: pointer; transition: all 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-class:hover { transform: translateY(-5px); border-color: #3B82F6; background: #EFF6FF; box-shadow: 0 10px 30px rgba(59,130,246,0.15); }
        .btn-class i { font-size: 3rem; color: #3B82F6; }

        .btn-nav {
            background: #2563EB; color: white; border: none; padding: 15px 40px; border-radius: 50px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(37,99,235,0.3);
        }
        .btn-nav:hover { background: #1D4ED8; transform: scale(1.05); }
        .btn-nav-outline { background: #FFFFFF; border: 2px solid #CBD5E1; color: #475569; box-shadow: none; }
        .btn-nav-outline:hover { background: #F1F5F9; color: #1E293B; border-color: #94A3B8; }
        
        .controls-bottom { margin-top: 40px; display: flex; gap: 20px; }
        .btn-close { position: absolute; top: 30px; right: 30px; background: #FEE2E2; border: 1px solid #EF4444; color: #EF4444; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 4px 6px rgba(239,68,68,0.2);}
        .btn-close:hover { background: #EF4444; color: white; }

        /* Timer */
        .timer-display { font-size: 8rem; font-weight: 900; font-variant-numeric: tabular-nums; color: #D97706; text-shadow: 0 4px 10px rgba(217,119,6,0.2); margin: 20px 0; }
        .timer-pulse { animation: pulse 1s infinite; color: #DC2626; text-shadow: 0 4px 10px rgba(220,38,38,0.3); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Artística Rhythm Game */
        .rhythm-container { display: flex; gap: 30px; margin: 50px 0; }
        .rhythm-pad { width: 150px; height: 150px; border-radius: 50%; background: #F1F5F9; border: 4px solid #CBD5E1; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: #475569; transition: 0.1s; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .pad-active-red { background: #EF4444; border-color: #DC2626; box-shadow: 0 0 30px rgba(239,68,68,0.5); transform: scale(1.1); color: white; }
        .pad-active-blue { background: #3B82F6; border-color: #2563EB; box-shadow: 0 0 30px rgba(59,130,246,0.5); transform: scale(1.1); color: white; }
        .pad-active-yellow { background: #F59E0B; border-color: #D97706; box-shadow: 0 0 30px rgba(245,158,11,0.5); transform: scale(1.1); color: white; }

        .notebook-icon { font-size: 6rem; color: #059669; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="screen-menu" class="screen active-screen">
        <a href="login.html" class="btn-close" title="Volver al Panel"><i class="ph ph-x"></i></a>
        <h1>Modo Proyector</h1>
        <p>Selecciona la clase magistral para proyectar. Los estudiantes solo necesitarán su cuaderno y un lápiz.</p>
        
        <div class="menu-grid">
            <button class="btn-class" onclick="showWeeks('fisica6', 'Física 6º')">
                <i class="ph ph-planet"></i> Física 6º<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
            <button class="btn-class" onclick="showWeeks('fisica7', 'Física 7º')">
                <i class="ph ph-trend-up"></i> Física 7º<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
            <button class="btn-class" onclick="showWeeks('quimica', 'Química PENSAR')">
                <i class="ph ph-flask"></i> Química PENSAR<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
            <button class="btn-class" onclick="showWeeks('etica', 'Ética')">
                <i class="ph ph-scales"></i> Ética<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
            <button class="btn-class" onclick="showWeeks('artistica', 'Artística')">
                <i class="ph ph-music-notes"></i> Artística<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
            <button class="btn-class" onclick="showWeeks('turismo', 'Turismo')">
                <i class="ph ph-suitcase"></i> Turismo<br><span style="font-size: 1rem; color:#9CA3AF; font-weight: normal;">Ver Semanas</span>
            </button>
        </div>
    </div>

    <!-- PANTALLA DE SELECCIÓN DE SEMANAS -->
    <div id="screen-weeks" class="screen">
        <button class="btn-close" onclick="backToMainMenu()"><i class="ph ph-arrow-left"></i></button>
        <h1 id="weeks-title">Semanas</h1>
        <p>Selecciona la semana y clase a proyectar.</p>
        <div class="menu-grid" id="weeks-grid">
            <!-- Botones dinámicos de semanas -->
        </div>
    </div>

    <!-- PANTALLA GENÉRICA DE CLASE -->
    <div id="screen-slide" class="screen">
        <button class="btn-close" onclick="backToMenu()"><i class="ph ph-house"></i></button>
        
        <div id="slide-icon" class="notebook-icon"><i class="ph ph-notebook"></i></div>
        <h1 id="slide-title">Título</h1>
        <h2 id="slide-subtitle">Subtítulo</h2>
        <p id="slide-content">Contenido</p>
        
        <div id="slide-custom-area"></div>

        <div id="timer-container" style="display:none; flex-direction: column; align-items: center;">
            <div id="timer-text" class="timer-display">00:00</div>
            <button class="btn-nav btn-nav-outline" onclick="startTimerGlobal()" id="btn-start-timer"><i class="ph ph-play"></i> Iniciar Tiempo</button>
        </div>

        <div class="controls-bottom">
            <button class="btn-nav btn-nav-outline" onclick="prevSlide()"><i class="ph ph-arrow-left"></i> Anterior</button>
            <button class="btn-nav" onclick="nextSlide()">Siguiente <i class="ph ph-arrow-right"></i></button>
        </div>
    </div>

    <script>
        let dbData = { clases: {} };
        let currentCourse = null;
        let currentSlideIdx = 0;
        let timerInterval = null;
        let currentTimerSeconds = 0;

        // Cargar datos dinámicos al iniciar
        fetch('proyectorData.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                dbData = data;
                console.log("Datos de proyector cargados:", dbData);
            })
            .catch(err => console.error("Error cargando proyectorData:", err));

        function showWeeks(courseId, courseName) {
            document.getElementById('weeks-title').innerText = courseName;
            const grid = document.getElementById('weeks-grid');
            grid.innerHTML = '';

            const subjectData = dbData.clases[courseId] || {};
            let hasWeeks = false;

            for (let i = 1; i <= 8; i++) {
                const weekClasses = subjectData[i.toString()];
                if (weekClasses && weekClasses.length > 0) {
                    hasWeeks = true;
                    // Generar botones. Si hay varias clases (ej. Física), poner botón por clase
                    weekClasses.forEach((claseObj, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'btn-class';
                        btn.innerHTML = `<i class="ph ph-calendar"></i> Semana ${i}<br><span style="font-size:1rem; color:#10B981;">Clase ${idx + 1}</span>`;
                        btn.onclick = () => startClass(courseId, i, idx);
                        grid.appendChild(btn);
                    });
                } else {
                    // Mostrar bloqueado
                    const btn = document.createElement('button');
                    btn.className = 'btn-class';
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                    btn.innerHTML = `<i class="ph ph-lock"></i> Semana ${i}<br><span style="font-size:1rem; color:#9CA3AF;">Próximamente</span>`;
                    grid.appendChild(btn);
                }
            }

            document.getElementById('screen-menu').classList.remove('active-screen');
            document.getElementById('screen-weeks').classList.add('active-screen');
        }

        function backToMainMenu() {
            document.getElementById('screen-weeks').classList.remove('active-screen');
            document.getElementById('screen-menu').classList.add('active-screen');
        }

        function startClass(courseId, week, classIdx) {
            currentCourse = dbData.clases[courseId][week][classIdx];
            currentSlideIdx = 0;
            document.getElementById('screen-weeks').classList.remove('active-screen');
            document.getElementById('screen-slide').classList.add('active-screen');
            renderSlide();
        }

        function backToMenu() {
            clearInterval(timerInterval);
            document.getElementById('screen-slide').classList.remove('active-screen');
            document.getElementById('screen-menu').classList.add('active-screen');
        }

        function nextSlide() {
            if (currentSlideIdx < currentCourse.length - 1) {
                currentSlideIdx++;
                renderSlide();
            } else {
                alert("Fin de la clase magistral.");
                backToMenu();
            }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) {
                currentSlideIdx--;
                renderSlide();
            }
        }

        function renderSlide() {
            clearInterval(timerInterval);
            const slide = currentCourse[currentSlideIdx];
            
            document.getElementById('slide-title').innerHTML = slide.title;
            document.getElementById('slide-subtitle').innerHTML = slide.sub;
            document.getElementById('slide-content').innerHTML = slide.content;
            document.getElementById('slide-icon').innerHTML = `<i class="ph ${slide.icon}"></i>`;
            
            const customArea = document.getElementById('slide-custom-area');
            customArea.innerHTML = slide.customHtml || "";

            const timerContainer = document.getElementById('timer-container');
            const timerText = document.getElementById('timer-text');
            const btnTimer = document.getElementById('btn-start-timer');

            if (slide.timer) {
                timerContainer.style.display = 'flex';
                currentTimerSeconds = slide.timer;
                updateTimerDisplay();
                btnTimer.style.display = 'block';
                timerText.classList.remove('timer-pulse');
                timerText.style.color = '#FBBF24';
            } else {
                timerContainer.style.display = 'none';
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(currentTimerSeconds / 60).toString().padStart(2, '0');
            const s = (currentTimerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-text').innerText = `${m}:${s}`;
        }

        function startTimerGlobal() {
            document.getElementById('btn-start-timer').style.display = 'none';
            timerInterval = setInterval(() => {
                if (currentTimerSeconds > 0) {
                    currentTimerSeconds--;
                    updateTimerDisplay();
                    if (currentTimerSeconds <= 10) {
                        document.getElementById('timer-text').classList.add('timer-pulse');
                    }
                } else {
                    clearInterval(timerInterval);
                    document.getElementById('timer-text').style.color = '#EF4444';
                    document.getElementById('timer-text').innerText = "¡TIEMPO!";
                    document.getElementById('timer-text').classList.remove('timer-pulse');
                    // Play a soft beep if needed
                }
            }, 1000);
        }

        // =====================================
        // MOTOR DE RITMO PARA ARTÍSTICA
        // =====================================
        let rhythmInterval = null;
        function startRhythm(level) {
            if(rhythmInterval) clearInterval(rhythmInterval);
            
            if(level === 1) {
                const p1 = document.getElementById('pad-1');
                const p2 = document.getElementById('pad-2');
                let step = 0;
                // 4/4 Beat: Rojo (aplauso), Silencio, Azul (Mesa), Silencio
                rhythmInterval = setInterval(() => {
                    p1.className = 'rhythm-pad'; p2.className = 'rhythm-pad';
                    p1.innerHTML = `<i class="ph ph-hand-clapping"></i>`;
                    p2.innerHTML = `<i class="ph ph-hand-pointing"></i>`;

                    if (step === 0 || step === 4) {
                        p1.classList.add('pad-active-red');
                        p1.innerHTML = `<strong>¡PLAS!</strong>`;
                    } else if (step === 2 || step === 6) {
                        p2.classList.add('pad-active-blue');
                        p2.innerHTML = `<strong>¡PAM!</strong>`;
                    }
                    
                    step++;
                    if(step > 7) step = 0;
                }, 800); // 800ms = 75 BPM
            }
            
            if(level === 2) {
                const p3 = document.getElementById('pad-3');
                const p4 = document.getElementById('pad-4');
                const p5 = document.getElementById('pad-5');
                let step = 0;
                rhythmInterval = setInterval(() => {
                    p3.className = 'rhythm-pad'; p4.className = 'rhythm-pad'; p5.className = 'rhythm-pad';
                    p3.innerHTML = `<i class="ph ph-hand-clapping"></i>`;
                    p4.innerHTML = `<i class="ph ph-hand-pointing"></i>`;
                    p5.innerHTML = `<i class="ph ph-hands-clapping"></i>`;

                    if (step === 0 || step === 3) p3.classList.add('pad-active-red');
                    if (step === 1 || step === 4) p4.classList.add('pad-active-blue');
                    if (step === 2) p5.classList.add('pad-active-yellow');
                    
                    step++;
                    if(step > 4) step = 0;
                }, 500); // Fast!
            }
        }
    </script>
</body>
</html>
